name: Release Jellyfin 12

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (for example 12.4.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  DIST_ARCHIVES_PATH: dist/kinopoisk
  MANIFEST_FILE: dist/manifest.json
  TARGET_ABI: 12.4.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate version and changelog
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use four numeric components (for example 12.4.0.0)."
            exit 1
          fi
          CHANGELOG=$(awk -v version="$VERSION" '
            $0 ~ "^## \\[v?" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md must contain a non-empty section for version $VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore ./src/Jellyfin.Plugin.Kinopoisk.sln

      - name: Build
        run: dotnet build --configuration Release --no-restore --property:Version=${VERSION} ./src/Jellyfin.Plugin.Kinopoisk.sln

      - name: Test
        run: dotnet test --configuration Release --no-build ./src/Jellyfin.Plugin.Kinopoisk.sln

      - name: Package release archive
        run: |
          mkdir -p "${DIST_ARCHIVES_PATH}"
          RELEASE_FILENAME="jellyfin-plugin-kinopoisk_${VERSION}.zip"
          RELEASE_FILE="${DIST_ARCHIVES_PATH}/${RELEASE_FILENAME}"
          zip --junk-paths "$RELEASE_FILE" \
            ./src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll \
            ./src/KinopoiskUnofficialInfo.ApiClient/bin/Release/net10.0/KinopoiskUnofficialInfo.ApiClient.dll
          echo "RELEASE_FILENAME=$RELEASE_FILENAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE=$RELEASE_FILE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          files: dist/kinopoisk/jellyfin-plugin-kinopoisk_${{ inputs.version }}.zip

      - name: Update manifest
        run: |
          HASH=$(md5sum "${RELEASE_FILE}" | cut -d' ' -f1)
          CHANGELOG_JSON=$(jq -Rs . <<< "${CHANGELOG}")
          SOURCE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/v${VERSION}/${RELEASE_FILENAME}"
          jq --arg version "$VERSION" \
             --arg hash "$HASH" \
             --argjson changelog "$CHANGELOG_JSON" \
             --arg abi "$TARGET_ABI" \
             --arg timestamp "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
             --arg source "$SOURCE_URL" \
             '.[0].versions = ([{
               "version": $version,
               "checksum": $hash,
               "changelog": $changelog,
               "targetAbi": $abi,
               "sourceUrl": $source,
               "timestamp": $timestamp
             }] + [.[0].versions[] | select(.targetAbi != $abi)])' \
             "$MANIFEST_FILE" > "$MANIFEST_FILE.tmp"
          mv "$MANIFEST_FILE.tmp" "$MANIFEST_FILE"

      - name: Commit manifest
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$MANIFEST_FILE"
          git commit -m "Publish Jellyfin 12 plugin manifest for v${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
