<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>КиноПоиск</title>
</head>
<body>
    <div id="KinopoiskConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="KinopoiskConfigForm">
                    <div class="inputContainer">
                        <label class="inputeLabel inputLabelUnfocused" for="ApiToken">API-KEY</label>
                        <input id="ApiToken" name="ApiToken" type="password" is="emby-input" autocomplete="new-password" />
                        <div class="fieldDescription">Укажите личный API-ключ (обязателен для запросов). Получить его можно на
                            <a href="https://kinopoiskapiunofficial.tech/profile" target="_blank" rel="noopener noreferrer">странице профиля Kinopoisk Unofficial API</a>.
                        </div>
                    </div>

                    <div class="selectContainer">
                        <label class="selectLabel" for="PremiereDateSource">Дата премьеры</label>
                        <select is="emby-select" id="PremiereDateSource" name="PremiereDateSource" class="emby-select-withcolor emby-select">
                            <option value="World">Мировая премьера</option>
                            <option value="Russia">Российская премьера (кино, затем DVD и цифра)</option>
                            <option value="YearOnly">Только год выпуска (без запросов)</option>
                        </select>
                        <div class="fieldDescription">Первые два варианта тратят один дополнительный запрос к API на каждый фильм или сериал. Если российской даты нет, берётся мировая.</div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Сохранить</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var KinopoiskPluginConfig = {
                pluginUniqueId: '33e6d249-648f-44cd-a9ce-497be06c08df',
                // The server returns enums as strings, numbers are handled too just in case.
                premiereDateSourceName: function (value) {
                    var names = ['World', 'Russia', 'YearOnly'];
                    if (names.indexOf(value) >= 0)
                        return value;
                    var index = parseInt(value, 10);
                    return names[index] || 'World';
                }
            };

            $('#KinopoiskConfigPage').on('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(KinopoiskPluginConfig.pluginUniqueId).then(function (config) {
                    $('#ApiToken').val(config.ApiToken).change();
                    $('#PremiereDateSource').val(KinopoiskPluginConfig.premiereDateSourceName(config.PremiereDateSource));
                    Dashboard.hideLoadingMsg();
                });
            });

            $('#KinopoiskConfigForm').on('submit', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(KinopoiskPluginConfig.pluginUniqueId).then(function (config) {
                    config.ApiToken = $('#ApiToken').val();
                    config.PremiereDateSource = $('#PremiereDateSource').val();
                    ApiClient.updatePluginConfiguration(KinopoiskPluginConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                return false;
            });
        </script>
    </div>
</body>
</html>
